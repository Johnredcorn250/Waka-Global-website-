<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAKA GLOBAL</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {margin:0;background:#0A0A0A;color:white;font-family:'Outfit',sans-serif;}

.programs-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:40px;
}

.program-card {
  height:300px;
  background-size:cover;
  background-position:center;
  position:relative;
  cursor:pointer;
  display:flex;
  align-items:flex-end;
  padding:20px;
}

.program-card::after {
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.5);
}

.program-name,.program-desc,.program-num {
  position:relative;
  z-index:2;
}

.program-name {font-family:'Bebas Neue';font-size:24px;}
.program-desc {font-size:12px;color:#ccc;}
.program-num {position:absolute;top:10px;right:15px;font-size:60px;opacity:0.1;}

.program-modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
}

.program-modal.show {
  opacity:1;
  pointer-events:auto;
}

.program-modal-content {
  background:#181818;
  padding:30px;
  width:90%;
  max-width:400px;
  position:relative;
}

.program-modal-close {
  position:absolute;
  right:15px;
  top:10px;
  font-size:25px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1 style="padding:20px;">WAKA Programs</h1>

<div class="programs-grid">

<div class="program-card"
data-title="Strength Training"
data-desc="Build strength, muscle, and discipline through structured workouts."
style="background-image:url('images/wakastrengthtraining.jpg')">
<div class="program-num">01</div>
<div>
<div class="program-name">Strength Training</div>
<div class="program-desc">Build power</div>
</div>
</div>

<div class="program-card"
data-title="Conditioning"
data-desc="High intensity sessions to improve endurance and performance."
style="background-image:url('images/wakasheshape.jpg')">
<div class="program-num">02</div>
<div>
<div class="program-name">Conditioning</div>
<div class="program-desc">Push limits</div>
</div>
</div>

<div class="program-card"
data-title="Group Classes"
data-desc="Train in a motivating group environment."
style="background-image:url('images/wakagroupclasses.jpg')">
<div class="program-num">03</div>
<div>
<div class="program-name">Group Classes</div>
<div class="program-desc">Train together</div>
</div>
</div>

<div class="program-card"
data-title="Personal Coaching"
data-desc="One-on-one coaching tailored to your goals."
style="background-image:url('images/wakapersonaltraining.jpg')">
<div class="program-num">04</div>
<div>
<div class="program-name">Personal Coaching</div>
<div class="program-desc">1-on-1 coaching</div>
</div>
</div>

<div class="program-card"
data-title="Mobility & Recovery"
data-desc="Improve flexibility and recover better."
style="background-image:url('images/wakagroupclasses.jpg')">
<div class="program-num">05</div>
<div>
<div class="program-name">Mobility</div>
<div class="program-desc">Recover faster</div>
</div>
</div>

<div class="program-card"
data-title="Hiking"
data-desc="Explore Rwanda with the WAKA community."
style="background-image:url('images/wakahiking.jpg')">
<div class="program-num">06</div>
<div>
<div class="program-name">Hiking</div>
<div class="program-desc">Explore nature</div>
</div>
</div>

</div>

<!-- MODAL -->
<div class="program-modal" id="modal">
<div class="program-modal-content">
<span class="program-modal-close">&times;</span>
<h3 id="modalTitle"></h3>
<p id="modalDesc"></p>
</div>
</div>

<script>
const modal = document.getElementById('modal');
const title = document.getElementById('modalTitle');
const desc = document.getElementById('modalDesc');

document.querySelectorAll('.program-card').forEach(card=>{
card.onclick=()=>{
title.textContent=card.dataset.title;
desc.textContent=card.dataset.desc;
modal.classList.add('show');
}
});

document.querySelector('.program-modal-close').onclick=()=>{
modal.classList.remove('show');
};

modal.onclick=(e)=>{
if(e.target===modal) modal.classList.remove('show');
};
</script>

</body>
</html>
